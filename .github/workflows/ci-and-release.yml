name: Rust, Leptos, Wasm, 3 Desktop & 2 Mobile Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-rust-and-wasm:
    name: Test Workspace & Wasm Isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run workspace unit tests
        run: cargo test --workspace
      - name: Verify Wasm target builds without persistent-storage
        run: |
          cargo check -p willow_gap_core --target wasm32-unknown-unknown --no-default-features
          cargo check -p internovel_auth --target wasm32-unknown-unknown
          node scripts/check-wasm-graph.mjs

  package-desktop:
    name: Desktop Build (${{ matrix.os }})
    needs: verify-rust-and-wasm
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage,archive
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg,archive
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: msi,nsis,archive
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - name: Install Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev patchelf
      - name: Install cargo-leptos & cargo-packager
        run: |
          cargo install --locked cargo-leptos
          cargo install --locked cargo-packager
      - name: Build Leptos release & desktop packages
        run: |
          cargo leptos build --release
          cargo build --release --target ${{ matrix.target }} -p internovel_server
          cargo packager --release --config packaging/CargoPackager.toml --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: internovel-desktop-${{ matrix.target }}
          path: pkg/dist/*

  package-ios:
    name: Mobile Build (iOS XCFramework + Swift UniFFI)
    needs: verify-rust-and-wasm
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build iOS staticlibs & UniFFI Swift bindings
        run: |
          cargo build --release --target aarch64-apple-ios -p internovel_ffi
          cargo build --release --target aarch64-apple-ios-sim -p internovel_ffi
          mkdir -p pkg/ios/bindings
          cargo run -p internovel_ffi --features bindgen-cli --bin uniffi-bindgen generate \
            --library target/aarch64-apple-ios/release/libinternovel_ffi.a \
            --language swift \
            --out-dir pkg/ios/bindings
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libinternovel_ffi.a \
            -library target/aarch64-apple-ios-sim/release/libinternovel_ffi.a \
            -output pkg/ios/InterNovelFFI.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: internovel-mobile-ios
          path: pkg/ios/*

  package-android:
    name: Mobile Build (Android NDK .so + Kotlin UniFFI)
    needs: verify-rust-and-wasm
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install cargo-ndk & build JNI libraries + Kotlin bindings
        run: |
          cargo install --locked cargo-ndk
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o pkg/android/jniLibs build --release -p internovel_ffi
          mkdir -p pkg/android/bindings
          cargo run -p internovel_ffi --features bindgen-cli --bin uniffi-bindgen generate \
            --library pkg/android/jniLibs/arm64-v8a/libinternovel_ffi.so \
            --language kotlin \
            --out-dir pkg/android/bindings
      - uses: actions/upload-artifact@v4
        with:
          name: internovel-mobile-android
          path: pkg/android/*
